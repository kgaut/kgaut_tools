name: CI

on:
  push:
    branches: [2.0.x]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality (PHPCS / PHPStan / PHPUnit)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php-version }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php-version }}-composer-

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --no-progress --with-all-dependencies

      - name: Drupal Coding Standards (PHPCS)
        run: ./vendor/bin/phpcs --standard=phpcs.xml.dist

      - name: Static analysis (PHPStan)
        run: ./vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --no-progress --memory-limit=512M

      - name: Unit tests (PHPUnit)
        run: ./vendor/bin/phpunit -c phpunit.xml.dist
